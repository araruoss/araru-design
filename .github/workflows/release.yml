name: Semantic release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Use RELEASE_PLEASE_TOKEN when repository policy blocks GITHUB_TOKEN
          # from creating pull requests. Otherwise the built-in token is enough.
          # If the action still reports a PR permission error, enable
          # "Allow GitHub Actions to create and approve pull requests" in the
          # repository Actions settings or configure that secret.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
